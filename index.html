<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOapp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; color: #ffffff; }
        .top-bar { background-color: #4a55a2; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo-text { font-size: 22px; font-weight: bold; color: #ffffff; }
        .icon-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #ffffff; }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .promo-card { background-color: #261c33; border: 1px solid #4a3563; border-radius: 12px; padding: 16px; margin-bottom: 18px; }
        .promo-card h3 { color: #c58af9; margin-bottom: 8px; font-size: 18px; }
        .promo-card p { font-size: 14px; line-height: 1.5; color: #e0e0e0; margin-bottom: 12px; }
        .download-link { color: #38bdf8; text-decoration: underline; font-weight: bold; font-size: 14px; }
        .post-box { background-color: #1e1e1e; border-radius: 12px; padding: 15px; margin-bottom: 20px; border: 1px solid #333; }
        textarea { width: 100%; height: 90px; background-color: #2a2a2a; border: 1px solid #444; border-radius: 8px; padding: 12px; color: #ffffff; font-size: 15px; resize: none; margin-bottom: 12px; }
        .file-label { display: block; text-align: center; border: 1px dashed #eab308; color: #facc15; padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 12px; font-size: 14px; }
        #previewContainer img { max-width: 100%; border-radius: 8px; margin-bottom: 12px; }
        .post-btn { width: 100%; background-color: #eab308; color: #000000; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .post-card { background-color: #1e1e1e; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; }
        .post-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: #aaaaaa; }
        .post-author { color: #facc15; font-weight: bold; font-size: 15px; }
        .post-content { font-size: 15px; line-height: 1.5; margin-bottom: 10px; white-space: pre-wrap; }
        .post-image { width: 100%; border-radius: 8px; margin-bottom: 10px; }
        .post-actions { display: flex; justify-content: space-between; border-top: 1px solid #333; padding-top: 10px; }
        .action-btn { background: none; border: none; color: #e0e0e0; font-size: 14px; cursor: pointer; }
        .loading-text { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="logo-text">GOapp</div>
        <button id="settingsBtn" class="icon-btn" title="ቅንብሮች">⚙️</button>
    </header>

    <main class="container">
        <div class="promo-card">
            <h3>✨ Hypic AI ማቀናበሪያ</h3>
            <p>በዚህ አፕ ላይ የምታዩዋቸው ውብ ፎቶዎች በሙሉ በ Hypic AI የተቀናበሩ ናቸው። እናንተም አሁኑኑ አውርዳችሁ ተጠቀሙ!</p>
            <a href="https://google.com" class="download-link">አፑን ለማውረድ እዚህ ይጫኑ 📥</a>
        </div>

        <div class="post-box">
            <textarea id="postText" placeholder="ምን አዲስ ነገር አለ?"></textarea>
            <label for="mediaInput" class="file-label">📁 ከስልክ ጋለሪ ፎቶ/ቪዲዮ ምረጥ</label>
            <input type="file" id="mediaInput" accept="image/*" hidden>
            <div id="previewContainer"></div>
            <button id="postBtn" class="post-btn">አጋራ (Post)</button>
        </div>

        <div id="feedContainer" class="feed-container">
            <p class="loading-text">ልጥፎች እየተጫኑ ነው...</p>
        </div>
    </main>

    <script>
        var DB_URL = "https://firebaseio.com";
        var userName = localStorage.getItem("goapp_username") || "ቅዱስ ቲቪ";
        var selectedImageBase64 = "";

        document.getElementById("settingsBtn").onclick = function() {
            var newName = prompt("የመለያ ስምዎን ያስገቡ፦", userName);
            if (newName && newName.trim() !== "") {
                userName = newName.trim();
                localStorage.setItem("goapp_username", userName);
                alert("ስምዎ ወደ " + userName + " ተቀይሯል!");
            }
        };

        document.getElementById("mediaInput").onchange = function(event) {
            var file = event.target.files.item(0);
            if (!file) return;
            var preview = document.getElementById("previewContainer");
            preview.innerHTML = '<p style="color:#facc15; text-align:center;">ፎቶው እየተዘጋጀ ነው...</p>';
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement("canvas");
                    var maxWidth = 800;
                    var width = img.width;
                    var height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    var ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    selectedImageBase64 = canvas.toDataURL("image/jpeg", 0.75);
                    preview.innerHTML = '<img src="' + selectedImageBase64 + '">';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        document.getElementById("postBtn").onclick = function() {
            var textInput = document.getElementById("postText");
            var text = textInput.value.trim();
            if (!text && !selectedImageBase64) {
                alert("እባክዎ መጀመሪያ ጽሑፍ ይጻፉ ወይም ፎቶ ይምረጡ!");
                return;
            }
            var postBtn = document.getElementById("postBtn");
            postBtn.textContent = "እየተላከ ነው...";
            postBtn.disabled = true;

            var newPost = { author: userName, text: text, image: selectedImageBase64, likes: 0, timestamp: Date.now() };
            var xhr = new XMLHttpRequest();
            xhr.open("POST", DB_URL + ".json", true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    postBtn.textContent = "አጋራ (Post)";
                    postBtn.disabled = false;
                    if (xhr.status >= 200 && xhr.status < 300) {
                        textInput.value = "";
                        selectedImageBase64 = "";
                        document.getElementById("previewContainer").innerHTML = "";
                        document.getElementById("mediaInput").value = "";
                        loadPosts();
                    } else {
                        alert("መላክ አልተቻለም (ኮድ: " + xhr.status + ")");
                    }
                }
            };
            xhr.send(JSON.stringify(newPost));
        };

        function loadPosts() {
            var feed = document.getElementById("feedContainer");
            var xhr = new XMLHttpRequest();
            xhr.open("GET", DB_URL + ".json", true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        var data = JSON.parse(xhr.responseText);
                        feed.innerHTML = "";
                        if (!data) {
                            feed.innerHTML = '<p class="loading-text">እስካሁን ምንም ልጥፍ የለም። የመጀመሪያውን ይፖስቱ!</p>';
                            return;
                        }
                        var keys = Object.keys(data).reverse();
                        for (var i = 0; i < keys.length; i++) {
                            var id = keys[i];
                            var post = data[id];
                            var card = document.createElement("div");
                            card.className = "post-card";
                            var html = '<div class="post-header"><span class="post-author">' + (post.author || "ቅዱስ ቲቪ") + '</span><span>' + new Date(post.timestamp).toLocaleDateString() + '</span></div>';
                            if (post.text) html += '<div class="post-content">' + post.text + '</div>';
                            if (post.image) html += '<img src="' + post.image + '" class="post-image">';
                            html += '<div class="post-actions">';
                            html += '<button class="action-btn" onclick="likePost(\'' + id + '\', ' + (post.likes || 0) + ')">❤️ ላይክ (' + (post.likes || 0) + ')</button>';
                            if (post.image) html += '<a href="' + post.image + '" download="GOapp_photo.jpg" class="action-btn" style="text-decoration:none;">⬇️ አውርድ</a>';
                            html += '<button class="action-btn" onclick="deletePost(\'' + id + '\')">🗑️ አጥፋ</button>';
                            html += '</div>';
                            card.innerHTML = html;
                            feed.appendChild(card);
                        }
                    } else {
                        feed.innerHTML = '<p class="loading-text">መጫን አልተቻለም (ኮድ: ' + xhr.status + ')</p>';
                    }
                }
            };
            xhr.send();
        }

        function likePost(id, currentLikes) {
            var xhr = new XMLHttpRequest();
            xhr.open("PATCH", DB_URL + "/" + id + ".json", true);
            xhr.setRequestHeader("Content-Type", "application/json");
